# ReelFree — archive + upload to TestFlight with an App Store Connect API key.
# No certificate or provisioning profile in secrets: Xcode automatic signing
# (cloud-managed distribution certificate) via -allowProvisioningUpdates.
# The monthly cron keeps a fresh build available: a TestFlight build expires after 90 days.
name: testflight

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 6 1 * *'   # 1st of every month, 06:17 UTC

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  RF_PROJECT: ios/ReelFree.xcodeproj
  RF_SCHEME: ReelFree

jobs:
  tests:
    name: Tests (ci.yml)
    uses: ./.github/workflows/ci.yml

  upload:
    name: Archive + upload (macos-15)
    needs: tests
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RF_BUNDLE_ID: ${{ secrets.RF_BUNDLE_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID RF_BUNDLE_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::missing secrets:$missing (see docs/TESTFLIGHT.md)"; exit 1; }

      - name: Toolchain
        run: |
          xcodebuild -version
          # Fail early if this Xcode does not know the API-key auth flags.
          xcodebuild -help 2>&1 | grep -q -- '-authenticationKeyIssuerID' \
            || { echo "::error::xcodebuild lacks -authenticationKey* flags"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write API key (temporary)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$dir/AuthKey_$ASC_KEY_ID.p8"
          grep -q 'BEGIN PRIVATE KEY' "$dir/AuthKey_$ASC_KEY_ID.p8" \
            || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Version numbers
        run: |
          # Build number: strictly increasing, one per run of this workflow.
          echo "RF_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          # Marketing version: from the tag (v1.2.3 -> 1.2.3), else the value in project.yml.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::bad tag $GITHUB_REF"; exit 1; }
            echo "RF_MARKETING=MARKETING_VERSION=$v" >> "$GITHUB_ENV"
          else
            echo "RF_MARKETING=" >> "$GITHUB_ENV"
          fi

      - name: Archive (automatic signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RF_BUNDLE_ID: ${{ secrets.RF_BUNDLE_ID }}
        run: |
          rc=0
          xcodebuild archive \
            -project "$RF_PROJECT" -scheme "$RF_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ReelFree.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            RF_BUNDLE_ID="$RF_BUNDLE_ID" \
            RF_TEAM_ID="$APPLE_TEAM_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$RF_BUILD" \
            $RF_MARKETING \
            > "$RUNNER_TEMP/archive.log" 2>&1 || rc=$?
          # Public repo: logs are world-readable. Print only error lines, never the full
          # log (it names the signing identity, i.e. the account holder's real name).
          # Allowlist: status lines and error lines only, with quoted strings and
          # parentheses (identity, team, profile names) redacted.
          grep -E '(^\*\* [A-Z ]+ \*\*$|error:)' "$RUNNER_TEMP/archive.log" \
            | sed -E -e 's/(Apple (Distribution|Development)|iPhone (Distribution|Developer)|[Tt]eam)[^"]*/\1: <redacted>/g' -e 's/"[^"]*"/"<redacted>"/g' -e "s/'[^']*'/'<redacted>'/g" -e 's/\([^)]*\)/(<redacted>)/g' | head -50 || true
          exit $rc

      - name: Export + upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :testFlightInternalTestingOnly bool true" \
            "$plist"
          rc=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ReelFree.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || rc=$?
          # Same allowlist + redaction as above (public logs).
          grep -E '(^\*\* [A-Z ]+ \*\*$|error:|EXPORT SUCCEEDED|Upload succeeded|Uploaded )' "$RUNNER_TEMP/export.log" \
            | sed -E -e 's/(Apple (Distribution|Development)|iPhone (Distribution|Developer)|[Tt]eam)[^"]*/\1: <redacted>/g' -e 's/"[^"]*"/"<redacted>"/g' -e "s/'[^']*'/'<redacted>'/g" -e 's/\([^)]*\)/(<redacted>)/g' | head -50 || true
          [ $rc -eq 0 ] || exit $rc
          echo "Uploaded build $RF_BUILD. It appears in TestFlight after Apple processing (~10-30 min)." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key and logs
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP"/*.log
